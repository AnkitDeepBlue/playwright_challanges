trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: Baba12224454

steps:
- task: UseNode@1
  inputs:
    version: '14.x'
  displayName: 'Use Node.js'

# Remove Docker if previously installed
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S apt-get remove -y docker docker-engine docker.io containerd runc
    echo "${SUDO_PASSWORD}" | sudo -S apt-get autoremove -y
    echo "${SUDO_PASSWORD}" | sudo -S rm -rf /var/lib/docker
  displayName: 'Remove Docker'

# Clean up any residual Docker files and reset permissions
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S rm -rf /home/azureuser/myagent/_work/3/s/venv
    echo "${SUDO_PASSWORD}" | sudo -S rm -rf /home/azureuser/myagent/_work/_temp/*
    echo "${SUDO_PASSWORD}" | sudo -S chown -R $(whoami):$(whoami) /home/azureuser/myagent/_work
  displayName: 'Clean Up and Reset Permissions'

# Install necessary dependencies and set up the environment
- script: |
    # Update and install necessary system dependencies for Playwright
    echo "${SUDO_PASSWORD}" | sudo -S apt-get update
    echo "${SUDO_PASSWORD}" | sudo -S apt-get install -y libatk1.0-0 \
        libatk-bridge2.0-0 \
        libcups2 \
        libatspi2.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxrandr2 \
        libgbm1 \
        libxkbcommon0 \
        libpango-1.0-0 \
        libcairo2 \
        libx11-xcb1 \
        libxcursor1 \
        libxi6 \
        libgtk-3-0 \
        libpangocairo-1.0-0 \
        libcairo-gobject2 \
        libgdk-pixbuf2.0-0 \
        python3-venv

    # Navigate to the project directory
    cd $(Build.SourcesDirectory)

    # Set up a Python virtual environment
    python3 -m venv venv
    source venv/bin/activate

    # Upgrade pip
    pip install --upgrade pip

    # Install Python dependencies from requirements.txt if it exists
    if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "requirements.txt not found"; fi

    # Ensure pytest and other dependencies are installed
    pip install pytest allure-pytest junit-xml

    # Install Node.js dependencies
    if [ -f package.json ]; then npm install; fi

    # Install Playwright browsers
    npx playwright install

    # Set PYTHONPATH to include the project root
    export PYTHONPATH=$(Build.SourcesDirectory)

    # Run the tests with pytest and generate Allure and JUnit reports
    pytest tests/test_table.py --alluredir=allure-results --junitxml=junit-results.xml

    # Generate Allure report
    allure generate allure-results -o allure-report
  displayName: 'Set Up Environment and Run Tests'

# Publish Allure Report
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-report'
    ArtifactName: 'AllureReport'
  displayName: 'Publish Allure Report'

# Publish JUnit Report
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/junit-results.xml'
    ArtifactName: 'JUnitReport'
  displayName: 'Publish JUnit Report'