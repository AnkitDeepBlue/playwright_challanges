trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: $(SUDO_PASSWORD)

steps:
- checkout: self

# Build Docker Image
- task: Docker@2
  inputs:
    command: 'build'
    Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
    tags: 'my-python-image'
  displayName: 'Build Docker Image'

# Run Tests in Docker Container
- task: Docker@2
  inputs:
    command: 'run'
    imageName: 'my-python-image'
    options: '--rm -v $(Build.SourcesDirectory):/app -v $(Build.ArtifactStagingDirectory):/artifacts'
    containerCommand: '/bin/bash -c "
    cd /app &&
    . venv/bin/activate &&
    pytest tests/test_table.py --alluredir=/app/allure-results --junitxml=/app/junit-results.xml &&
    allure generate /app/allure-results -o /app/allure-report &&
    chown -R root:root /app/allure-results /app/allure-report /app/junit-results.xml"'
  displayName: 'Run Tests in Docker Container'

# Publish Allure Report
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-report'
    ArtifactName: 'AllureReport'
  displayName: 'Publish Allure Report'

# Publish JUnit Report
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/junit-results.xml'
    ArtifactName: 'JUnitReport'
  displayName: 'Publish JUnit Report'