trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: Baba12224454

steps:
- task: UseNode@1
  inputs:
    version: '14.x'
  displayName: 'Use Node.js'

- checkout: self

# Run the tests inside the Playwright container
- task: Docker@2
  inputs:
    container: 'mcr.microsoft.com/playwright:v1.17.2-focal'
    options: '-u 0:0'  # Run as root to avoid permission issues
    command: 'bash'
    arguments: '-c "
      cd /app && 
      npm install && 
      npx playwright install && 
      python3 -m venv venv && 
      source venv/bin/activate && 
      pip install --upgrade pip && 
      pip install -r requirements.txt && 
      pip install pytest allure-pytest junit-xml &&
      pytest tests/test_table.py --alluredir=/app/allure-results --junitxml=/app/junit-results.xml &&
      allure generate /app/allure-results -o /app/allure-report"'
  displayName: 'Run Tests in Playwright Container'

# Publish Allure Report
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-report'
    ArtifactName: 'AllureReport'
  displayName: 'Publish Allure Report'

# Publish JUnit Report
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/junit-results.xml'
    ArtifactName: 'JUnitReport'
  displayName: 'Publish JUnit Report'