trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: Baba12224454  # Use Azure DevOps secret variables for security

steps:
# Step to install Docker if it's not already installed
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S apt-get update
    echo "${SUDO_PASSWORD}" | sudo -S apt-get install -y \
        apt-transport-https \
        ca-certificates \
        curl \
        software-properties-common
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
    sudo add-apt-repository \
       "deb [arch=amd64] https://download.docker.com/linux/ubuntu \
       $(lsb_release -cs) \
       stable"
    sudo apt-get update
    echo "${SUDO_PASSWORD}" | sudo -S apt-get install -y docker-ce
    sudo usermod -aG docker $(whoami)
  displayName: 'Install Docker'

# Step to restart the agent to apply Docker permissions
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S systemctl restart docker
  displayName: 'Restart Docker Service'

# Step to build the Docker image
- script: |
    echo "FROM ubuntu:20.04
    RUN apt-get update && apt-get install -y python3 python3-pip python3-venv \
        libatk1.0-0 \
        libatk-bridge2.0-0 \
        libcups2 \
        libatspi2.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxrandr2 \
        libgbm1 \
        libxkbcommon0 \
        libpango-1.0-0 \
        libcairo2 \
        libx11-xcb1 \
        libxcursor1 \
        libxi6 \
        libgtk-3-0 \
        libpangocairo-1.0-0 \
        libcairo-gobject2 \
        libgdk-pixbuf2.0-0 \
        zip \
        curl && \
        curl -fsSL https://deb.nodesource.com/setup_14.x | bash - && \
        apt-get install -y nodejs && \
        npm install -g allure-commandline
    COPY . /workspace
    WORKDIR /workspace
    RUN python3 -m venv venv && \
        source venv/bin/activate && \
        pip install --upgrade pip && \
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo 'requirements.txt not found'; fi && \
        if [ -f package.json ]; then npm install; fi && \
        npx playwright install
    " > Dockerfile
    docker build -t test-image .
  displayName: 'Build Docker Image'

# Step to run tests and generate reports in Docker container
- script: |
    docker run --rm -v $(Build.SourcesDirectory):/workspace -w /workspace test-image /bin/bash -c "
      source venv/bin/activate && \
      export PYTHONPATH=$(Build.SourcesDirectory) && \
      pytest tests/test_table.py --alluredir=allure-results --junitxml=junit.xml && \
      allure generate allure-results -o allure-report || echo 'Allure report generation failed.'
    "
  displayName: 'Run tests and generate reports in Docker container'

# Publish JUnit Test Results
- task: PublishTestResults@2
  inputs:
    testResultsFiles: '**/junit.xml'
    mergeTestResults: true
    testRunTitle: 'JUnit Test Results'

# Publish Allure Report as artifact
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)/allure-report'
    artifactName: 'AllureReport'
    publishLocation: 'Container'

# Publish Allure Report HTML file as a separate artifact for easy access
- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/allure-report'
    Contents: '**/*'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/AllureReport'
  displayName: 'Copy Allure Report to Staging Directory'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/AllureReport'
    ArtifactName: 'AllureReportHTML'
    publishLocation: 'Container'
  displayName: 'Publish Allure Report HTML as Build Artifact'