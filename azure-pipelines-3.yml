trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: Baba12224454

steps:
- checkout: self

# Install Docker
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S apt-get update
    echo "${SUDO_PASSWORD}" | sudo -S apt-get install -y docker.io
    echo "${SUDO_PASSWORD}" | sudo -S systemctl start docker
    echo "${SUDO_PASSWORD}" | sudo -S systemctl enable docker
    echo "${SUDO_PASSWORD}" | sudo -S usermod -aG docker $(whoami)
  displayName: 'Install and Start Docker'

# Create Dockerfile dynamically
- script: |
    cat <<EOF > Dockerfile
    FROM python:3.11
    WORKDIR /app
    RUN apt-get update && \
        apt-get install -y openjdk-11-jre nodejs npm && \
        npm install -g allure-commandline@2.18.1
    COPY requirements.txt /app/requirements.txt
    RUN python -m venv venv && \
        . venv/bin/activate && \
        pip install --upgrade pip && \
        pip install -r requirements.txt && \
        npx playwright install --with-deps
    COPY . /app
    EOF
  displayName: 'Create Dockerfile'

# Build Docker Image
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S docker build -t my-python-image .
  displayName: 'Build Docker Image'

# Run Tests in Docker Container
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S docker run --rm -v $(Build.SourcesDirectory):/src -v $(Build.ArtifactStagingDirectory):/artifacts my-python-image /bin/bash -c "
    cd /src &&
    source venv/bin/activate &&
    pytest tests/test_table.py --alluredir=/artifacts/allure-results --junitxml=/artifacts/junit-results.xml"
  displayName: 'Run Tests in Docker Container'

# Generate Allure Report
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S docker run --rm -v $(Build.ArtifactStagingDirectory)/allure-results:/allure-results -v $(Build.ArtifactStagingDirectory)/allure-report:/allure-report my-python-image /bin/bash -c "
    allure generate /allure-results -o /allure-report"
  displayName: 'Generate Allure Report'

# Publish Allure Report
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/allure-report'
    artifact: 'AllureReport'
  displayName: 'Publish Allure Report'

# Publish JUnit Report
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/junit-results.xml'
    artifact: 'JUnitReport'
  displayName: 'Publish JUnit Report'