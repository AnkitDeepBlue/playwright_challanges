trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: Baba12224454

steps:
- task: UseNode@1
  inputs:
    version: '18.x'
  displayName: 'Use Node.js 18'

# Clean up old files and directories before checkout
- script: |
    echo "${SUDO_PASSWORD}" | sudo -S find /home/azureuser/myagent/_work/3/s -mindepth 1 -delete
    echo "${SUDO_PASSWORD}" | sudo -S find /home/azureuser/myagent/_work/3/a -mindepth 1 -delete
  displayName: 'Clean up old files'

- checkout: self

# Use a Docker container to run the tests
- task: Docker@2
  inputs:
    containerRegistry: ''
    repository: 'mcr.microsoft.com/playwright:v1.17.2-focal'
    command: 'run'
    arguments: |
      --rm 
      -v $(Build.SourcesDirectory):/app 
      -v $(Build.ArtifactStagingDirectory):/artifacts 
      bash -c "
        apt-get update && 
        apt-get install -y python3-venv && 
        cd /app && 
        python3 -m venv venv && 
        source venv/bin/activate && 
        pip install --upgrade pip && 
        pip install pytest junit-xml pytest-html allure-pytest && 
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi && 
        if [ -f package.json ]; then npm install; fi && 
        npx playwright install && 
        pytest tests/test_table.py --junitxml=/artifacts/junit-results.xml --html=/artifacts/report.html --self-contained-html --alluredir=/artifacts/allure-results && 
        allure generate /artifacts/allure-results -o /artifacts/allure-report"

# Publish JUnit test results
- task: PublishTestResults@2
  inputs:
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/junit-results.xml'
    testResultsFormat: 'JUnit'
    failTaskOnFailedTests: true

# Publish HTML report
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/report.html'
    artifact: 'HTML Report'
    publishLocation: 'pipeline'

# Publish Allure report
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/allure-report'
    artifact: 'Allure Report'
    publishLocation: 'pipeline'