trigger:
- master

pool:
  name: 'private_pool'

variables:
  SUDO_PASSWORD: $(YourActualPasswordHere)  # Use Azure DevOps secret variables for security

steps:
- task: UseNode@1
  inputs:
    version: '14.x'
  displayName: 'Use Node.js'

- script: |
    # Update and install necessary system dependencies for Playwright
    echo "${SUDO_PASSWORD}" | sudo -S apt-get update
    echo "${SUDO_PASSWORD}" | sudo -S apt-get install -y libatk1.0-0 \
        libatk-bridge2.0-0 \
        libcups2 \
        libatspi2.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxrandr2 \
        libgbm1 \
        libxkbcommon0 \
        libpango-1.0-0 \
        libcairo2 \
        libx11-xcb1 \
        libxcursor1 \
        libxi6 \
        libgtk-3-0 \
        libpangocairo-1.0-0 \
        libcairo-gobject2 \
        libgdk-pixbuf2.0-0 \
        python3-venv

    # Install Java (required for Allure)
    echo "${SUDO_PASSWORD}" | sudo -S apt-get install -y default-jre

    # Navigate to the project directory
    cd $(Build.SourcesDirectory)

    # Set up a Python virtual environment
    python3 -m venv venv
    source venv/bin/activate

    # Upgrade pip
    pip install --upgrade pip

    # Install Python dependencies from requirements.txt if it exists
    if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "requirements.txt not found"; fi

    # Ensure pytest, allure-pytest, and junit2html are installed
    pip install pytest allure-pytest junit2html

    # Install Node.js dependencies
    if [ -f package.json ]; then npm install; fi

    # Install Playwright browsers
    npx playwright install

    # Set PYTHONPATH to include the project root
    export PYTHONPATH=$(Build.SourcesDirectory)

    # Run the tests with pytest and generate Allure and JUnit XML reports
    pytest tests/test_table.py --alluredir=allure-results --junitxml=junit-results/results.xml

    # Generate Allure HTML report
    allure generate allure-results -o allure-report

    # Convert JUnit XML to HTML
    junit2html junit-results/results.xml junit-results/results.html
  env:
    SUDO_PASSWORD: $(SUDO_PASSWORD)
  displayName: 'Set Up Environment, Run Tests, and Generate Reports'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)/allure-report'
    artifactName: 'AllureReport'
    publishLocation: 'pipeline'
  displayName: 'Publish Allure Report as Artifact'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)/junit-results'
    artifactName: 'JUnitReport'
    publishLocation: 'pipeline'
  displayName: 'Publish JUnit Report as Artifact'

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.SourcesDirectory)/allure-report'
    artifactName: 'AllureHtmlReport'
    publishLocation: 'Container'
  displayName: 'Publish Allure HTML Report'

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.SourcesDirectory)/junit-results/results.html'
    artifactName: 'JUnitHtmlReport'
    publishLocation: 'Container'
  displayName: 'Publish JUnit HTML Report'