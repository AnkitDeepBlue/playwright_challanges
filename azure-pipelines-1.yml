trigger:
- master

pool:
  name: 'private_pool'

steps:
- task: UseNode@1
  inputs:
    version: '14.x'
  displayName: 'Use Node.js'

- script: |
    # Install necessary system dependencies for Playwright
    echo "your_sudo_password" | sudo -S apt-get update
    echo "your_sudo_password" | sudo -S apt-get install -y libatk1.0-0 \
        libatk-bridge2.0-0 \
        libcups2 \
        libatspi2.0-0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxrandr2 \
        libgbm1 \
        libxkbcommon0 \
        libpango-1.0-0 \
        libcairo2 \
        python3-venv

    # Navigate to the project directory
    cd $WORKSPACE

    # Set up a Python virtual environment
    python3 -m venv venv
    source venv/bin/activate

    # Upgrade pip
    pip install --upgrade pip

    # Install dependencies from requirements.txt
    pip install -r requirements.txt

    # Install Node.js dependencies
    npm install

    # Install Playwright browsers
    npx playwright install

    # Set PYTHONPATH to include the project root
    export PYTHONPATH=$WORKSPACE

    # Run the tests with pytest and generate Allure reports
    pytest tests/test_table.py --alluredir=allure-results
  displayName: 'Set Up Environment and Run Tests'