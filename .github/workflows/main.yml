# .github/workflows/ci.yml

name: Run Pytest with Allure Reporting

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m venv venv  # Create a virtual environment
          source venv/bin/activate  # Activate the virtual environment
          pip install --upgrade pip  # Upgrade pip
          pip install pytest allure-pytest  # Install pytest and allure-pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi  # Install additional dependencies from requirements.txt if it exists

      - name: Install Playwright Browsers
        run: |
          source venv/bin/activate  # Activate the virtual environment
          playwright install  # Install the Playwright browsers

      - name: Install Allure commandline
        run: |
          # Install Allure using the official installer
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.21.0/allure-2.21.0.tgz | sudo tar -xz -C /opt/
          sudo ln -s /opt/allure-2.21.0/bin/allure /usr/bin/allure

      - name: Run tests with pytest and generate Allure results
        env:
          PYTHONPATH: ${{ github.workspace }}  # Add the repository root to PYTHONPATH
        run: |
          source venv/bin/activate  # Ensure the virtual environment is activated
          mkdir -p allure-results  # Create the directory for Allure results
          pytest tests/test_table.py --alluredir=allure-results  # Run pytest and output Allure results

      - name: Generate Allure HTML Report
        run: |
          allure generate allure-results --clean -o allure-report  # Generate the Allure HTML report

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v3
        with:
          name: AllureReport
          path: allure-report

      - name: Serve Allure Report
        if: always()
        run: |
          sudo apt-get install -y nginx
          sudo cp -r allure-report/* /var/www/html/
          sudo service nginx start
          echo "Allure report is being served on http://localhost"