name: Run Pytest with Playwright and Allure Reporting in Docker and Deploy to Netlify

on:
  workflow_dispatch:
    inputs:
      marker:
        description: 'Pytest marker to run specific tests'
        required: false
        default: 'smoke'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous Allure results and reports
        run: |
          rm -rf allure-results/*
          rm -rf allure-report/*

      - name: Install Java, Node.js, and Allure Commandline
        run: |
          apt-get update && apt-get install -y openjdk-11-jre-headless curl
          curl -fsSL https://deb.nodesource.com/setup_16.x | bash -
          apt-get install -y nodejs
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.21.0/allure-2.21.0.tgz
          tar -xz -C /opt/ -f allure.tgz
          ln -s /opt/allure-2.21.0/bin/allure /usr/bin/allure
          rm allure.tgz

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pytest allure-pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Playwright Install
        run: playwright install --with-deps

      - name: Run tests with pytest and generate Allure results
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -m ${{ github.event.inputs.marker }} --alluredir=allure-results
          allure generate allure-results --clean -o allure-report
          ls -al allure-report

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: |
          netlify deploy --prod --dir=allure-report --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}