name: Run Pytest with Allure Reporting

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pytest allure-pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Browsers
        run: |
          source venv/bin/activate
          playwright install

      - name: Install Allure Commandline
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.21.0/allure-2.21.0.tgz | sudo tar -xz -C /opt/
          sudo ln -s /opt/allure-2.21.0/bin/allure /usr/bin/allure

      - name: Verify Allure Installation
        run: |
          allure --version

      - name: Clean previous Allure results and reports
        run: |
          rm -rf allure-results/*
          rm -rf allure-report/*

      - name: Run tests with pytest and generate Allure results
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source venv/bin/activate
          pytest tests/test_table.py --alluredir=allure-results
          ls -al allure-results

      - name: Generate Allure HTML Report
        run: |
          allure generate allure-results --clean -o allure-report
          ls -al allure-report

      - name: Serve Allure Report
        run: |
          nohup python3 -m http.server --directory allure-report 8080 &
          echo "Allure report is being served at http://localhost:8080"

      - name: Zip Allure Report
        run: |
          zip -r allure-report.zip allure-report

      - name: Upload Allure Report as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AllureReportZip
          path: allure-report.zip